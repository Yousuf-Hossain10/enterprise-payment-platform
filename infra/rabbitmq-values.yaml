# bitnami/rabbitmq — local dev instance for the `platform` namespace.
# Credentials here are local-dev-only plaintext, per docs/Security-Model.md
# section 3. Management UI plugin is on by default (chart default), reachable
# via port-forward per Phase 3's Definition of Done.
#
# image override: docker.io/bitnami/rabbitmq has zero published tags as of
# this writing — Broadcom's Bitnami catalog restructuring emptied the free
# `bitnami/*` namespace for this image entirely (unlike postgresql/redis,
# which still serve a `latest` tag). The frozen historical images now live
# under `bitnamilegacy/*`, which still has the chart's expected version.
image:
  registry: docker.io
  repository: bitnamilegacy/rabbitmq
  tag: 4.1.3-debian-12-r1

# Required alongside the bitnamilegacy override above: the chart refuses to
# deploy an image it doesn't recognize as "standard" unless this is set.
# See https://github.com/bitnami/charts/issues/30850.
global:
  security:
    allowInsecureImages: true

auth:
  username: "payment_platform"
  password: "local-dev-rabbitmq"

persistence:
  size: 1Gi
